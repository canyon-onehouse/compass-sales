<!doctype html>
<!--
  PROTOTYPE — throwaway. Ticket #5 "Canonical visual direction".
  Four variants switchable via ?variant= and the floating bottom bar:
  the two homepage generations and the two Work-index generations.
  Double-click this file; it iframes the sibling prototype pages.

  To run: extract uploads/Compass Design Website.zip (gitignored, in the
  repo clone) into a directory, drop this file alongside the extracted
  HTML pages, and open it in a browser.

  VERDICT (ticket #5): the current sparse generation is canonical; v1 is
  superseded. See docs/adr/0001-canonical-visual-direction-sparse-generation.md.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROTOTYPE — Visual direction switcher</title>
<style>
  html, body { margin: 0; height: 100%; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
  .bar {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 4px;
    background: #111; color: #fff; border-radius: 999px;
    padding: 6px 10px; box-shadow: 0 6px 24px rgba(0,0,0,.35);
    font: 500 13px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    z-index: 9999; user-select: none;
  }
  .bar button {
    all: unset; cursor: pointer; padding: 6px 10px; border-radius: 999px;
    font-size: 14px;
  }
  .bar button:hover { background: rgba(255,255,255,.15); }
  .bar .label { padding: 0 8px; min-width: 240px; text-align: center; letter-spacing: .02em; }
  .bar .key { color: #f5c518; margin-right: 6px; }
</style>
</head>
<body>

<iframe id="frame" title="Variant preview"></iframe>

<div class="bar" role="toolbar" aria-label="Prototype variant switcher">
  <button id="prev" aria-label="Previous variant">←</button>
  <span class="label" id="label"></span>
  <button id="next" aria-label="Next variant">→</button>
</div>

<script>
  const VARIANTS = [
    { key: 'A1', name: 'Current — Homepage',   src: 'Compass Homepage.html' },
    { key: 'B1', name: 'v1 — Homepage',        src: 'Compass Homepage v1.html' },
    { key: 'A2', name: 'Current — Work index', src: 'Projects.html' },
    { key: 'B2', name: 'v1 — Work index',      src: 'Projects v1.html' },
  ];

  const frame = document.getElementById('frame');
  const label = document.getElementById('label');

  function currentIndex() {
    const k = new URLSearchParams(location.search).get('variant') || 'A1';
    const i = VARIANTS.findIndex(v => v.key === k);
    return i === -1 ? 0 : i;
  }

  function show(i) {
    const v = VARIANTS[(i + VARIANTS.length) % VARIANTS.length];
    frame.src = encodeURI(v.src);
    label.innerHTML = '<span class="key">' + v.key + '</span>' + v.name;
    try { history.replaceState(null, '', '?variant=' + v.key); } catch (e) { /* file:// may refuse; fine */ }
  }

  document.getElementById('prev').addEventListener('click', () => show(currentIndex() - 1));
  document.getElementById('next').addEventListener('click', () => show(currentIndex() + 1));

  window.addEventListener('keydown', (e) => {
    const t = document.activeElement;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    if (e.key === 'ArrowLeft') show(currentIndex() - 1);
    if (e.key === 'ArrowRight') show(currentIndex() + 1);
  });

  show(currentIndex());
</script>
</body>
</html>
